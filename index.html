<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Một Ổ Nha!</title>
    <link rel="stylesheet" href="style.css">
    <link rel="apple-touch-icon" href="/mot-o-nha/images/icon.png?v=2">

    <!-- Favicon trong trình duyệt -->
    <link rel="icon" type="image/png" href="images/icon.png">

    <!-- PWA / Web App -->
<link rel="manifest" href="./manifest.json">

<meta name="theme-color" content="#f7b6c2">

<!-- iOS cũ: mở từ Home Screen như app -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Một Ổ Nha!">

    <!-- Ảnh xem trước khi chia sẻ link -->
    <meta property="og:title" content="Một Ổ Nha!">
    <meta property="og:description" content="Tự tay làm bánh mì và phát triển tiệm nhỏ của bạn.">
    <meta property="og:image" content="https://hhuync.github.io/mot-o-nha/images/icon.png">
    <meta property="og:type" content="website">
</head>
<body>

    <!-- MÀN HÌNH MỞ ĐẦU -->
    <div id="start-screen">
        <div class="start-content">
            <h1>Một Ổ Nha!</h1>
            <p>Nhấn để vào tiệm 🥖</p>
        </div>
    </div>

    <main id="game">
        <header class="top-bar">
            <button id="settings-button" class="icon-button" type="button" title="Cài đặt" aria-label="Cài đặt"></button>
            <div class="top-center">
                <strong id="day-display">Một Ổ Nha!</strong>
                <span id="status-display">Tiệm bánh mì nhỏ</span>
            </div>

            <div id="money-display" class="money">100k</div>
        </header>

        <section id="screen"></section>

        <section class="bottom-area">
            <button id="main-button" class="main-button" type="button">Chơi</button>
        </section>
    </main>

    <!-- SỔ CÔNG THỨC -->
    <div id="recipe-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="recipe-title">
        <div class="modal-box">
            <div class="modal-header">
                <h2 id="recipe-title">📖 Sổ công thức</h2>
                <button id="close-recipe" class="close-button" type="button" aria-label="Đóng sổ công thức">✕</button>
            </div>
            <div id="recipe-list"></div>
        </div>
    </div>

    <!-- HƯỚNG DẪN CHƠI -->
<div id="tutorial-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="tutorial-title">
    <div class="tutorial-box">
        <button id="tutorial-close" class="tutorial-close" type="button" aria-label="Đóng hướng dẫn">✕</button>

        <div class="tutorial-step" id="tutorial-step">1 / 5</div>

        <div class="tutorial-image-wrap">
            <img id="tutorial-image" src="images/guide/g1.png" alt="Hướng dẫn chơi">
        </div>

        <div class="tutorial-text">
            <h2 id="tutorial-title">Chào mừng đến với Một Ổ Nha!</h2>
            <p id="tutorial-caption"></p>
        </div>

        <div class="tutorial-controls">
            <button id="tutorial-prev" class="tutorial-nav-button" type="button">← Trước</button>
            <button id="tutorial-next" class="tutorial-nav-button primary" type="button">Tiếp →</button>
        </div>
    </div>
</div>

    <!-- Purchase / restock / warning popups are generated by game.js -->
    <script src="game.js"></script>

    <script>
    if ("serviceWorker" in navigator && location.protocol !== "file:") {
        let reloading = false;

        navigator.serviceWorker.addEventListener("controllerchange", () => {
            if (reloading) return;

            reloading = true;
            location.reload();
        });

        window.addEventListener("load", async () => {
            try {
                const registration = await navigator.serviceWorker.register(
                    "./sw.js",
                    { updateViaCache: "none" }
                );

                await registration.update();
            } catch (error) {
                console.warn("Chưa kiểm tra được bản cập nhật:", error);
            }
        });
    }
    </script>
</body>
</html>
